# Read-only identity for k8s-mcp.
#
# ClusterRole k8s-mcp-readonly grants get and list, nothing else, on an
# explicit list of resources. It never grants Secrets: there is no `secrets`
# entry and no wildcard (`*`) resource or API group that could include them.
# pods/log (get) lets pod_logs read container logs.
#
# Resources of API groups not listed here (other CRDs, admission webhooks,
# leases, ...) are not readable with this role; the tools then return an RBAC
# "forbidden" error. To read them, add a rule with the exact group and
# resource names and verbs get, list. Do not add `secrets`, and do not use
# `*`: a wildcard in the core group includes Secrets.
#
# The Namespace, ServiceAccount and ClusterRoleBinding below are an example
# identity. Apply, then build a kubeconfig context for it (see README.md,
# "A read-only identity"):
#
#   kubectl apply -f deploy/rbac/readonly-clusterrole.yaml
#   kubectl -n k8s-mcp create token k8s-mcp --duration=8h
#
# ConfigMaps are readable: k8s-mcp masks credential-looking values, but that
# is best effort. Keep credentials in Secrets, not ConfigMaps.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: k8s-mcp-readonly
  labels:
    app.kubernetes.io/name: k8s-mcp
rules:
  # Core group: everything k8s-mcp reads except Secrets.
  - apiGroups: [""]
    resources:
      - configmaps
      - endpoints
      - events
      - limitranges
      - namespaces
      - nodes
      - persistentvolumeclaims
      - persistentvolumes
      - pods
      - podtemplates
      - replicationcontrollers
      - resourcequotas
      - serviceaccounts
      - services
    verbs: [get, list]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  - apiGroups: [apps]
    resources: [controllerrevisions, daemonsets, deployments, replicasets, statefulsets]
    verbs: [get, list]
  - apiGroups: [batch]
    resources: [cronjobs, jobs]
    verbs: [get, list]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [get, list]
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    verbs: [get, list]
  - apiGroups: [networking.k8s.io]
    resources: [ingressclasses, ingresses, networkpolicies]
    verbs: [get, list]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list]
  - apiGroups: [events.k8s.io]
    resources: [events]
    verbs: [get, list]
  - apiGroups: [storage.k8s.io]
    resources: [csidrivers, csinodes, storageclasses, volumeattachments]
    verbs: [get, list]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [clusterrolebindings, clusterroles, rolebindings, roles]
    verbs: [get, list]
  - apiGroups: [apiextensions.k8s.io]
    resources: [customresourcedefinitions]
    verbs: [get, list]
  # metrics-server (top).
  - apiGroups: [metrics.k8s.io]
    resources: [nodes, pods]
    verbs: [get, list]
  # Gateway API.
  - apiGroups: [gateway.networking.k8s.io]
    resources:
      - backendtlspolicies
      - gatewayclasses
      - gateways
      - grpcroutes
      - httproutes
      - referencegrants
      - tcproutes
      - tlsroutes
      - udproutes
    verbs: [get, list]
  # Flux CD (flux_status). RBAC has no group wildcards, so each
  # *.toolkit.fluxcd.io group is listed.
  - apiGroups: [source.toolkit.fluxcd.io]
    resources: [buckets, gitrepositories, helmcharts, helmrepositories, ocirepositories]
    verbs: [get, list]
  - apiGroups: [kustomize.toolkit.fluxcd.io]
    resources: [kustomizations]
    verbs: [get, list]
  - apiGroups: [helm.toolkit.fluxcd.io]
    resources: [helmreleases]
    verbs: [get, list]
  - apiGroups: [notification.toolkit.fluxcd.io]
    resources: [alerts, providers, receivers]
    verbs: [get, list]
  - apiGroups: [image.toolkit.fluxcd.io]
    resources: [imagepolicies, imagerepositories, imageupdateautomations]
    verbs: [get, list]
---
# Example identity bound to the role.
apiVersion: v1
kind: Namespace
metadata:
  name: k8s-mcp
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: k8s-mcp
  namespace: k8s-mcp
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: k8s-mcp-readonly
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: k8s-mcp-readonly
subjects:
  - kind: ServiceAccount
    name: k8s-mcp
    namespace: k8s-mcp
