---
# The canary Secret. Its value is corpus.SecretCanary
# (test/injection/corpus); it and its base64 form must never appear in any
# tool output or in the server's stderr. It is also in an annotation and in
# a label-free data key, so a metadata-only leak would be caught too.
apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
  namespace: broken
  annotations:
    example.com/note: "password is k8smcp-canary-secret-value-7f3a9c2e51d4"
type: Opaque
stringData:
  username: app
  password: k8smcp-canary-secret-value-7f3a9c2e51d4
---
# A pod that uses the Secret as a volume and as an env reference, so the
# Secret shows up in pod specs, describe and events (by name only). It never
# prints the value.
apiVersion: v1
kind: Pod
metadata:
  name: secret-user
  namespace: broken
spec:
  terminationGracePeriodSeconds: 1
  containers:
    - name: app
      image: "@BUSYBOX_IMAGE@"
      command: ["sleep", "3600"]
      env:
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-credentials
              key: password
      volumeMounts:
        - name: creds
          mountPath: /etc/creds
          readOnly: true
      resources:
        requests: {cpu: 5m, memory: 8Mi}
        limits: {memory: 32Mi}
  volumes:
    - name: creds
      secret:
        secretName: db-credentials
